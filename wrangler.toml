name = "two45-live-worker"
main = "worker.js"
compatibility_date = "2026-10-01"

# Existing secrets remain managed in Cloudflare and are not stored here.
# Restore the last recorded production cadence. Internal stages select their
# own five-minute slots; a five-minute trigger would skip the minute-2 backfill.
[triggers]
crons = ["* * * * *"]
