name: AI Analyst Shadow Tests
on:
  pull_request:
    paths:
      - 'ai-analyst-*.mjs'
      - 'wrangler.ai-shadow.toml'
      - '.github/workflows/ai-analyst-shadow.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ai-analyst-shadow-v1.test.mjs ai-analyst-gemini-adapter-v1.test.mjs ai-analyst-shadow-worker-v1.test.mjs
