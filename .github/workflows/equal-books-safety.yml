name: Equal Bookmaker Quote Safety
on:
  pull_request:
    paths:
      - worker.js
      - tests/equal-priority-books.test.cjs
      - .github/workflows/equal-books-safety.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quote-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker.js
      - run: node --test tests/equal-priority-books.test.cjs
