name: Cross Competition History Safety
on:
  pull_request:
    paths:
      - worker.js
      - tests/cross-competition-history.test.cjs
      - .github/workflows/cross-competition-history.yml
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker.js
      - run: node --test tests/cross-competition-history.test.cjs
