name: Historical Coverage Safety
on:
  pull_request:
    paths:
      - worker.js
      - tests/historical-coverage-safety.test.cjs
      - .github/workflows/historical-coverage-safety.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker.js
      - run: node --test tests/historical-coverage-safety.test.cjs
