name: Validate Elite Intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'elite-intelligence-v86.js'
      - 'elite-intelligence-v86.test.mjs'
      - 'competition-tier-v87.js'
      - 'competition-tier-v87.test.mjs'
      - 'elite-slate-scope-v88.js'
      - 'elite-slate-scope-v88.test.mjs'
      - 'elite-research-evidence-v90.js'
      - 'elite-research-evidence-v90.test.mjs'
      - 'elite-final-review-v91.js'
      - 'elite-final-review-v91.test.mjs'
      - 'elite-selection-explanation-v92.js'
      - 'elite-selection-explanation-v92.test.mjs'
      - '.github/workflows/validate-elite-intelligence.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Elite intelligence
        run: node elite-intelligence-v86.test.mjs
      - name: Validate competition tiers
        run: node competition-tier-v87.test.mjs
      - name: Validate Elite slate scope
        run: node elite-slate-scope-v88.test.mjs
      - name: Validate external research evidence
        run: node elite-research-evidence-v90.test.mjs
      - name: Validate calibrated final review
        run: node elite-final-review-v91.test.mjs
      - name: Validate evidence-grounded explanations
        run: node elite-selection-explanation-v92.test.mjs
