name: Two45 Snapshot Safety Tests
on:
  pull_request:
    paths:
      - 'worker.js'
      - 'tests/snapshot-coalescing-*.test.cjs'
      - '.github/workflows/snapshot-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker syntax
        run: node --check worker.js
      - name: Snapshot coalescing regression suite
        run: node --test tests/snapshot-coalescing-v117.test.cjs tests/snapshot-coalescing-source.test.cjs
