name: Fixture board visibility
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/fixture-board-visibility.test.cjs
      - run: node --test tests/provider-burst-deferral.test.cjs
