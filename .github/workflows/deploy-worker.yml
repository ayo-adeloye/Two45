name: Deploy Two45 Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'engine2-shadow-runtime-v1.js'
      - 'tests/engine2-shadow-runtime.cjs'
      - 'scripts/bundle-engine2-shadow-v1.mjs'
      - 'engine2-shadow-adapter.mjs'
      - 'simulation-v2.mjs'
      - 'wrangler.toml'
      - 'player-*.mjs'
      - 'player-*.js'
      - 'tests/player-*.cjs'
      - 'scripts/bundle-player-research-v1.mjs'
      - 'model-validation-runtime-v1.js'
      - 'scripts/bundle-validation-routine-v1.mjs'
      - 'supabase/functions/two45-football-gateway/index.ts'
      - 'tests/football-gateway.cjs'
      - 'match-evidence-*.mjs'
      - 'match-evidence-*.js'
      - 'match-history-*.js'
      - 'scripts/bundle-match-evidence-v1.mjs'
      - 'tests/match-evidence-*.cjs'
      - '.github/workflows/deploy-worker.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate selection and publication invariants
        run: |
          node selection-v2.test.mjs
          node tests/quote-provenance.cjs
          node tests/elite-automation.cjs
          node model-review-v1.test.mjs
          node player-props-v1.test.mjs
          node tests/player-research-runtime.cjs
          node tests/football-gateway.cjs
          node match-evidence-v1.test.mjs
          node tests/match-evidence-runtime.cjs
          node tests/match-history-runtime.cjs
          node tests/match-evidence-ui.cjs
          node tests/model-validation-runtime.cjs
          node tests/model-review-runtime.cjs
          node forecast-core-v3.test.mjs
          node tests/forecast-core-runtime-v3.cjs
          node tests/forecast-core-sweep.cjs
          node tests/engine2-shadow-runtime.cjs
          node tests/engine2-settlement-runtime.cjs
          node shadow-evaluation-v2.test.mjs
          node tests/publication-v2.cjs
          node tests/record-ask.cjs
          node tests/tightening.cjs
          node tests/weekend-lock.mjs
          node competition-tier-v87.test.mjs
          node scripts/bundle-selection-v2.mjs
          node scripts/apply-forecast-core-runtime-v3.mjs
          node scripts/bundle-forecast-core-v3.mjs
          node scripts/bundle-tier.mjs
          node scripts/bundle-model-review-runtime-v1.mjs
          node scripts/bundle-model-review-v1.mjs
          node scripts/bundle-player-research-v1.mjs
          node scripts/bundle-validation-routine-v1.mjs
          node scripts/bundle-match-evidence-v1.mjs
          node scripts/bundle-engine2-shadow-v1.mjs
          git diff --exit-code worker.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Prepare frontend
        run: |
          mkdir -p public
          cp index.html public/index.html
      - name: Deploy publication scope notice
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name two45 --branch main
